# FaceLab stack: single FastAPI backend (generation + search, GPU) + Qdrant + MinIO
#
#   1) cp .env.example .env   and fill in the values
#   2) docker compose up -d --build
#   3) open http://<host>:8010
#
# ./data must contain the prebuilt index: front.index, front_ids.npy, front_paths.json
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-facelab}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-change_me_please}
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  facelab:
    build: .
    image: facelab:latest
    depends_on: [qdrant, minio]
    ports:
      - "8010:8010"
    environment:
      FACELAB_IMAGE_MODEL: ${FACELAB_IMAGE_MODEL:-klein}
      FACELAB_INDEX_DIR: /data
      FACELAB_STATIC_DIR: /app/static
      FACELAB_DATASET_ROOT: ${FACELAB_DATASET_ROOT:-/data/mugshots}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      FACELAB_KAGGLE_SLUG: ${FACELAB_KAGGLE_SLUG:-elliotp/idoc-mugshots}
      FACELAB_QDRANT_URL: http://qdrant:6333
      FACELAB_MINIO_ENDPOINT: minio:9000
      FACELAB_MINIO_ACCESS_KEY: ${MINIO_USER:-facelab}
      FACELAB_MINIO_SECRET_KEY: ${MINIO_PASSWORD:-change_me_please}
      FACELAB_MINIO_BUCKET: facelab
      FACELAB_FAST: "1"
      FACELAB_QUERY_N: "30"
      FACELAB_CPU_OFFLOAD: "0"
      # Which back end draws the images:
      #   openrouter -> hosted models over the OpenRouter API (needs internet)
      #   lab        -> the FLUX.2 server at FLUX_API_URL (works offline)
      #   local      -> a diffusers pipeline in this container (needs GPU+weights)
      # Flip this one value to move between them; nothing else has to change.
      FACELAB_PROVIDER: ${FACELAB_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_IMAGE_MODEL: ${OPENROUTER_IMAGE_MODEL:-black-forest-labs/flux.2-pro}
      OPENROUTER_EDIT_MODEL: ${OPENROUTER_EDIT_MODEL:-google/gemini-2.5-flash-image}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-300}
      # VLM auto-description (independent of FACELAB_PROVIDER: fal can draw
      # the pixels while the VLM reads the face). Point FACELAB_VLM_BASE_URL
      # at a lab vLLM/SGLang server later; nothing else changes.
      FACELAB_AUTODESCRIBE: ${FACELAB_AUTODESCRIBE:-1}
      FACELAB_VLM_BASE_URL: ${FACELAB_VLM_BASE_URL:-https://openrouter.ai/api/v1}
      FACELAB_VLM_MODEL: ${FACELAB_VLM_MODEL:-qwen/qwen3-vl-32b-instruct}
      FACELAB_VLM_KEY: ${FACELAB_VLM_KEY:-}
      FACELAB_VLM_TIMEOUT: ${FACELAB_VLM_TIMEOUT:-60}
      # Remote FLUX server (lab machine). Used when FACELAB_PROVIDER=lab; all
      # generation/editing runs there and this container needs no weights.
      FLUX_API_URL: ${FLUX_API_URL:-http://host.docker.internal:8000}
      FLUX_API_TIMEOUT: ${FLUX_API_TIMEOUT:-900}
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /hf
    volumes:
      - ./data:/data
      - hf_cache:/hf
    # Lets the container reach services published on the host (the labmate's
    # FLUX server) as http://host.docker.internal:8000 on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_data: {}
  minio_data: {}
  hf_cache: {}
